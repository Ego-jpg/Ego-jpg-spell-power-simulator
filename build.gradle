plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.egojpg'
version = '0.1.0'
base { archivesName = 'spell-power-simulator' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top' }
    maven { url = 'https://maven.kosmx.dev' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://code.redspace.io/releases' }
    maven { url = 'https://code.redspace.io/snapshots' }
    exclusiveContent {
        forRepository {
            ivy {
                name = 'IronSpellbooksModrinthRelease'
                url = 'https://cdn.modrinth.com/data/s4OWxYQQ/versions/slKLosTb/'
                patternLayout { artifact '[artifact]-[revision].[ext]' }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup 'modrinth' }
    }
}
neoForge {
    version = '21.1.250'
    runs { client { client() } }
    mods { spell_power_simulator { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.spell_power_simulator }
}
dependencies {
    implementation 'modrinth:irons_spellbooks:1.21.1-3.16.3'
    implementation 'mezz.jei:jei-1.21.1-neoforge:19.21.0.247'
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.5.1'
    implementation 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    implementation 'dev.kosmx.player-anim:player-animation-lib-forge:2.0.1+1.21.1'
    implementation 'io.redspace:irons_lib:1.21.1-2.1.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'net.neoforged:testframework:21.1.250'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
